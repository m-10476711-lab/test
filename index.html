  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f6f7fb;
      margin: 0; min-height:100vh;
    }
    .container {
      max-width: 900px;
      margin: 32px auto 0 auto;
      padding: 0 16px;
    }
    h1 {
      text-align: center;
      color: #E94646;
      font-size: 2.5rem;
      letter-spacing: 1.5px;
      margin-bottom: 18px;
      text-shadow: 1px 1px 0 #fff5, 0 2px 8px #fd7b72a6;
    }
    .subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 24px;
      font-size: 1.10rem;
    }
    .sellers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 1.5px 10px 0 rgba(233,71,70,0.08);
      padding: 22px 14px 16px 14px;
      display: flex; flex-direction: column; align-items: center;
      transition: box-shadow 0.16s;
    }
    .card:hover { box-shadow: 0 8px 22px 0 rgba(233,71,70,0.15);}
    .avatar {
      width: 88px; height: 88px; border-radius: 50%; object-fit: cover;
      border: 4px solid #f6c9c9;
      background: #eee;
      margin-bottom:15px;
    }
    .username {
      font-weight: 700;
      color: #E94646;
      font-size: 1.25rem;
      margin-bottom: 5px;
      text-align: center;
    }
    .phone {
      color: #444; font-size: 1.15em; margin-bottom: 13px; text-align: center;
      word-break: break-all;
    }
    .wa-btn {
      background: #25d366;
      color: #fff;
      border: none;
      border-radius: 7px;
      padding: 8px 18px;
      font-size: 1.06rem;
      cursor: pointer;
      display: flex; align-items: center; gap: 7px;
      text-decoration: none;
      transition: background 0.13s, box-shadow 0.2s;
      box-shadow: 0 1px 6px #ddd;
    }
    .wa-btn:hover { background: #1bd741; }
    .wa-btn svg { vertical-align: middle;}
    @media (max-width: 520px) {
      h1 { font-size: 1.5rem; }
      .card { padding: 17px 4px 10px 4px;}
      .avatar { width: 70px; height: 70px;}
    }
  </style>

  window.addEventListener('DOMContentLoaded', function() {
    var audio = document.getElementById('bg-music');
    function tryPlay() {
      audio.play().catch(()=>{});

      document.body.removeEventListener('touchstart', tryPlay);
    }
    audio.play().catch(()=>{});
    document.body.addEventListener('click', tryPlay, {once:true});
    document.body.addEventListener('touchstart', tryPlay, {once:true});
  });
  </script>
